# ─────────────────────────────────────────────────────────────────────────────
# deploy.yml — Deploy Cloud Function + Build & Deploy GitHub Pages
#
# Triggers:
#   • Push / merge to `main`
#   • Manual trigger (workflow_dispatch)
#
# Required Secrets:
#   GCF_SA_KEY         — GCP Service Account key JSON (base64-encoded)
#   VITE_GCF_URL       — Cloud Function URL (set after first GCF deploy)
#   SUPABASE_URL       — Also passed to GCF via set-env-vars
#   SUPABASE_SERVICE_KEY — GCF server-side Supabase service role key
#   SUPABASE_BUCKET    — Supabase storage bucket name
# ─────────────────────────────────────────────────────────────────────────────

name: "🚀 Build & Deploy"

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true   # cancel stale deploy if a new push arrives

jobs:
  # ── Deploy Cloud Function ──────────────────────────────────────────────────
  deploy_function:
    name: "☁️  Deploy Cloud Function"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCF_SA_KEY }}

      - name: Deploy Cloud Function
        uses: google-github-actions/deploy-cloud-functions@v3
        with:
          name: deals
          runtime: nodejs20
          entry_point: deals
          source_dir: functions/
          region: asia-southeast1
          set_env_vars: >-
            DATABASE_URL=${{ secrets.DATABASE_URL }},
            SUPABASE_URL=${{ secrets.SUPABASE_URL }},
            SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }},
            SUPABASE_BUCKET=${{ secrets.SUPABASE_BUCKET }},
            ALLOWED_ORIGIN=https://${{ github.repository_owner }}.github.io

  # ── Build ──────────────────────────────────────────────────────────────────
  build:
    name: "🏗️  Build Site"
    runs-on: ubuntu-latest
    needs: deploy_function
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Write .env for Vite build
        # vite.config.ts sets envDir to repo root (one level above site/)
        run: |
          cat > .env <<EOF
          VITE_GCF_URL=${{ secrets.VITE_GCF_URL }}
          EOF

      - name: Build
        working-directory: site
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Vite SPA outputs to site/dist/
          path: site/dist

  # ── Deploy ─────────────────────────────────────────────────────────────────
  deploy:
    name: "🚀 Deploy to GitHub Pages"
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
