# ─────────────────────────────────────────────────────────────────────────────
# pipeline.yml — Run the promo-radar data pipeline
#
# Triggers:
#   • Daily schedule at 10:00 AM SGT (02:00 UTC)
#   • Manual trigger (workflow_dispatch) with optional flags
#
# Required Secrets (Settings → Secrets and variables → Actions):
#   TELEGRAM_API_ID       — Telegram app API ID
#   TELEGRAM_API_HASH     — Telegram app API hash
#   TELEGRAM_SESSION      — base64-encoded telegram_session.session file
#   DATABASE_URL          — Neon PostgreSQL connection string
#   OPENROUTER_API_KEY    — OpenRouter API key
#   SUPABASE_URL          — Supabase project URL
#   SUPABASE_KEY          — Supabase anon key
#   SUPABASE_SERVICE_KEY  — Supabase service role key
#   SUPABASE_BUCKET       — Supabase storage bucket name
# ─────────────────────────────────────────────────────────────────────────────

name: "🔄 Data Pipeline"

on:
  schedule:
    - cron: "0 2 * * *"   # 10:00 AM SGT (UTC+8) = 02:00 UTC daily
  workflow_dispatch:
    inputs:
      skip_scrape:
        description: "Skip Telegram scrape step"
        type: boolean
        default: false
      skip_process:
        description: "Skip AI processing step"
        type: boolean
        default: false
      skip_geocode:
        description: "Skip geocoding step"
        type: boolean
        default: false
      skip_cleanup:
        description: "Skip expired deals cleanup step"
        type: boolean
        default: false

jobs:
  pipeline:
    name: "🔄 Run Pipeline"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crawler/requirements.txt

      - name: Install dependencies
        run: pip install --quiet -r crawler/requirements.txt

      - name: Restore last_scraped.json
        uses: actions/cache/restore@v4
        with:
          path: crawler/last_scraped.json
          key: last-scraped-${{ runner.os }}
          restore-keys: |
            last-scraped-

      - name: Write .env file
        run: |
          cat > .env <<EOF
          TELEGRAM_API_ID=${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH=${{ secrets.TELEGRAM_API_HASH }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_BUCKET=${{ secrets.SUPABASE_BUCKET }}
          EOF

      - name: Decode Telegram session
        run: echo "${{ secrets.TELEGRAM_SESSION }}" | base64 --decode > crawler/telegram_session.session

      - name: Run pipeline
        run: |
          ARGS=""
          [ "${{ inputs.skip_scrape }}"  = "true" ] && ARGS="$ARGS --skip-scrape"
          [ "${{ inputs.skip_process }}" = "true" ] && ARGS="$ARGS --skip-process"
          [ "${{ inputs.skip_geocode }}" = "true" ] && ARGS="$ARGS --skip-geocode"
          [ "${{ inputs.skip_cleanup }}" = "true" ] && ARGS="$ARGS --skip-cleanup"
          python pipeline.py $ARGS

      - name: Save last_scraped.json
        if: always()
        uses: actions/cache/save@v4
        with:
          path: crawler/last_scraped.json
          key: last-scraped-${{ runner.os }}-${{ github.run_id }}
