# ─────────────────────────────────────────────────────────────────────────────
# pipeline.yml — Data Pipeline (schedule only)
#
# Triggers:
#   • Daily cron at 02:00 UTC (10:00 SGT)
#   • Manual trigger (workflow_dispatch) with optional skip flags
#
# Required Secrets: TELEGRAM_API_ID, TELEGRAM_API_HASH, TELEGRAM_SESSION,
#                   DATABASE_URL, OPENROUTER_API_KEY, SUPABASE_URL,
#                   SUPABASE_KEY, SUPABASE_SERVICE_KEY, SUPABASE_BUCKET
# ─────────────────────────────────────────────────────────────────────────────

name: "🔄 Data Pipeline"

on:
  # schedule:                          # ← temporarily disabled
  #   - cron: "0 2 * * *"             # daily 02:00 UTC = 10:00 SGT
  workflow_dispatch:
    inputs:
      skip_scrape:
        description: "Skip Telegram scrape step"
        type: boolean
        default: false
      skip_process:
        description: "Skip OpenRouter AI processing step"
        type: boolean
        default: false
      skip_geocode:
        description: "Skip geocoding step"
        type: boolean
        default: false

concurrency:
  group: pipeline
  cancel-in-progress: false   # don't cancel a running scrape mid-way

jobs:
  run_pipeline:
    name: "Run pipeline.py"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crawler/requirements.txt

      - name: Install Python dependencies
        run: pip install -r crawler/requirements.txt

      - name: Write .env file
        run: |
          cat > .env <<EOF
          TELEGRAM_API_ID=${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH=${{ secrets.TELEGRAM_API_HASH }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_BUCKET=${{ secrets.SUPABASE_BUCKET }}
          EOF

      - name: Restore Telegram session file
        run: |
          echo "${{ secrets.TELEGRAM_SESSION }}" | base64 --decode > crawler/telegram_session.session

      - name: Run pipeline.py
        run: |
          ARGS=""
          if [ "${{ inputs.skip_scrape }}"  = "true" ]; then ARGS="$ARGS --skip-scrape";  fi
          if [ "${{ inputs.skip_process }}" = "true" ]; then ARGS="$ARGS --skip-process"; fi
          if [ "${{ inputs.skip_geocode }}" = "true" ]; then ARGS="$ARGS --skip-geocode"; fi
          python pipeline.py $ARGS
